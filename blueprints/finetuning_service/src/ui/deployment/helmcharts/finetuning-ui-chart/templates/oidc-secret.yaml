{{- if and .Values.apisixRoute.oidc.enabled .Values.apisixRoute.oidc.clientId }}
{{/*
  Client credentials for the APISIX openid-connect plugin.

  Must live in the same namespace as the ApisixRoute, because that is where the
  ingress controller resolves the plugin's secretRef. Kept in a Secret rather
  than inline in the route config so the client secret does not end up in the
  ApisixRoute CR, where anyone with read access to the namespace would see it.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apisixRoute.oidc.secretRef | quote }}
  labels:
    {{- include "finetuning-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  client_id: {{ .Values.apisixRoute.oidc.clientId | quote }}
  client_secret: {{ required "apisixRoute.oidc.clientSecret is required when oidc.enabled and clientId are set" .Values.apisixRoute.oidc.clientSecret | quote }}
{{- end }}
