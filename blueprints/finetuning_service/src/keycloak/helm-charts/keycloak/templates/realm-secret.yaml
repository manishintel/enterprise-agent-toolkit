{{/*
  Realm definition consumed by `start --import-realm`.

  Deliberately a Secret, not a ConfigMap: it carries the client secret (and,
  if configured, a bootstrap user password), which would otherwise be world
  readable to anyone with get-configmap in this namespace.

  Built with dict/toJson rather than hand-written JSON so quoting and escaping
  of values coming from config cannot produce an invalid realm file — an invalid
  file makes Keycloak exit on startup.
*/}}
{{- $client := dict
      "clientId" .Values.realm.client.id
      "enabled" true
      "protocol" "openid-connect"
      "publicClient" false
      "secret" (required "realm.client.secret is required" .Values.realm.client.secret)
      "standardFlowEnabled" true
      "implicitFlowEnabled" false
      "directAccessGrantsEnabled" false
      "serviceAccountsEnabled" false
      "redirectUris" .Values.realm.client.redirectUris
      "webOrigins" .Values.realm.client.webOrigins
      "attributes" (dict "post.logout.redirect.uris" (.Values.realm.client.postLogoutRedirectUris | default ""))
-}}
{{- $realm := dict
      "realm" .Values.realm.name
      "displayName" (.Values.realm.displayName | default .Values.realm.name)
      "enabled" true
      "sslRequired" "external"
      "loginWithEmailAllowed" .Values.realm.loginWithEmailAllowed
      "rememberMe" .Values.realm.rememberMe
      "clients" (list $client)
-}}
{{- if .Values.realm.bootstrapUser.username }}
{{- $cred := dict "type" "password" "value" (required "bootstrapUser.password is required when bootstrapUser.username is set" .Values.realm.bootstrapUser.password) "temporary" false -}}
{{- $user := dict
      "username" .Values.realm.bootstrapUser.username
      "enabled" true
      "emailVerified" true
      "email" (.Values.realm.bootstrapUser.email | default "")
      "firstName" (.Values.realm.bootstrapUser.firstName | default "")
      "lastName" (.Values.realm.bootstrapUser.lastName | default "")
      "credentials" (list $cred)
-}}
{{- $_ := set $realm "users" (list $user) -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.fullname" . }}-realm
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  realm.json: {{ $realm | toJson | quote }}
