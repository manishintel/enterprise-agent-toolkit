{{/*
  Admin, database and client credentials. Kept in a Secret rather than inline in
  the Deployment so they are not readable from `helm get manifest` output or the
  pod spec.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ required "admin.password is required" .Values.admin.password | quote }}
  db-password: {{ required "database.password is required" .Values.database.password | quote }}
