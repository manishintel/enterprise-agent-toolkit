# Fine-Tuning Service Configuration

# Application settings
app:
  name: finetuning-service
  replicaCount: 2  # Minimum 2 for zero-downtime deployments
  image:
    repository: registry.kube-system.svc.cluster.local:5000/finetuning-service
    tag: "latest"
    pullPolicy: Always

  # Image pull secrets for private registry (not needed for insecure local registry)
  # imagePullSecrets:
  #   - name: registry-secret

  service:
    type: ClusterIP
    port: 8000

  # Resource limits
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  # Pod termination grace period
  terminationGracePeriodSeconds: 60

  # Environment configuration
  config:
    # Nvidia/Unsloth API Configuration
    # REQUIRED: Set to your training backend URL (Nvidia APIs on port 8443)
    nvidiaApiUrl: ""  # e.g., "https://your-training-backend.com:8443"
    nvidiaKeycloakVerifySsl: "true"  # Whether to verify SSL when calling Keycloak
    enableNvidia: "true"

    # Rate Limiting Configuration
    # Enable/disable rate limiting globally
    rateLimitEnabled: "true"
    # Default rate limit for all endpoints (requests per minute)
    rateLimitDefault: "200"
    # Health check endpoints (lightweight operations)
    rateLimitHealth: "100"
    # Model list/retrieve endpoints (read operations)
    rateLimitModels: "100"
    # Job creation endpoint (resource-intensive)
    rateLimitJobCreate: "10"
    # Job listing/retrieve endpoints
    rateLimitJobRead: "60"
    # Job cancellation endpoint
    rateLimitJobCancel: "20"
    # Job events endpoint
    rateLimitJobEvents: "60"

    # Observability Configuration (Lightweight monitoring)
    # Enable/disable observability features (adds ~5-10MB per pod)
    observabilityEnabled: "true"
    # Use JSON structured logging (recommended for production)
    observabilityJsonLogs: "true"
    # Track user actions in metrics
    observabilityLogUserActions: "true"
    # Enable Prometheus metrics endpoint
    observabilityMetricsEnabled: "true"
    # Track per-user request metrics
    observabilityTrackUserMetrics: "true"
    # Collect system metrics (CPU, memory)
    observabilityCollectSystemMetrics: "true"

# ServiceAccount the API pods run as. A dedicated one is needed because it is
# granted permission to deploy fine-tuned models in the inference namespace.
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Deploying a fine-tuned model from the UI.
#
# The job detail page shows a "Deploy Model" button that runs the same Helm
# install the page prints, as a Job in the inference namespace. The chart itself
# comes from a ConfigMap published by the fine-tuning plugin playbook, so this
# service does not carry a copy of it and git stays the source of the chart.
modelDeployment:
  enabled: true
  # Namespace the vllm chart deploys models into.
  namespace: default
  # ConfigMap holding the packaged vllm chart and the values file to install with.
  chartConfigMap: vllm-chart
  chartArchiveKey: vllm-chart.tgz
  valuesKey: values.yaml
  # Image providing the helm binary for the deployment Job.
  helmImage: alpine/helm:3.16.4
  # ServiceAccount that Job runs as; it needs write access in the namespace above.
  deployerServiceAccount: ft-model-deployer
  # Create the ServiceAccounts, Roles and RoleBindings for the above.
  rbac:
    create: true
  # Each deployed model holds a model volume and a vLLM instance, so cap how
  # many can be up at once.
  maxDeployments: 3
  tensorParallelSize: 1
  pipelineParallelSize: 1
  # Pre-flight capacity check: reads node allocatable and the requests already
  # reserved on each node, so the UI can show what is free and a deploy that
  # cannot be placed is refused instead of being admitted onto a full node.
  #
  # This is the chart's only cluster-scoped RBAC (read-only on nodes, and pods
  # across namespaces). Set enabled=false to drop that grant: the check then
  # reports "capacity unknown" and deployment behaves as it did before.
  capacity:
    enabled: true
  # Sizing for a deployed model. The vllm chart only emits resource requests and
  # limits when cpu/memory are set, so these are what stop a model being placed
  # on a node with nothing left. The default is derived from the base model's
  # parameter count and is editable per-deploy in the UI.
  sizing:
    cpuCoresPerBillionParams: 4
    # Weights and working memory only. The KV cache is a separate term, because
    # vLLM reserves VLLM_CPU_KVCACHE_SPACE up front whatever the model's size --
    # folding it into a per-parameter figure under-sizes small models, which is an
    # OOM kill during load rather than a slow model.
    memoryGibPerBillionParams: 3
    memoryOverheadGib: 8
    # Assumed KV cache reservation when the packaged chart cannot be read; the
    # live value comes from the chart's own defaultModelConfigs.
    defaultKvCacheSpaceGib: 40
    # Used when the parameter count cannot be read from the model id.
    defaultCpuCores: 16
    defaultMemoryGib: 16
    minCpuCores: 2
    minMemoryGib: 8
    maxCpuCores: 128
    maxMemoryGib: 512
    # Largest share of one node a single deployment may request.
    maxNodeFraction: 0.5
  # Allow deploying anyway when the request does not fit. The check is a snapshot
  # and vLLM's real appetite is not exactly its request, so the refusal is
  # overridable — overrides are logged.
  allowCapacityOverride: true

# Ingress Configuration
ingress:
  enabled: false  # Disabled when using APISIX
  className: "nginx"

  # Domain configuration (path-based routing)
  # Base domain - CHANGE THIS to your domain (e.g., "example.com")
  baseDomain: "example.com"
  # Base path for the API - all endpoints will be under this path
  # CHANGE THIS if your architect suggests a different path name
  basePath: "/enterprise-ai"
  # Full URL will be: https://{{ .baseDomain }}{{ .basePath }}
  # Result: https://example.com/enterprise-ai

  # TLS secret name (will be auto-created from certs folder by deploy script)
  tlsSecretName: "finetuning-api-tls"

  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

  # Hosts configuration - deprecated, kept for backward compatibility
  hosts:
    - host: "{{ .Values.ingress.baseDomain }}"
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: "{{ .Values.ingress.tlsSecretName }}"
      # TLS secret created by deploy script from certs folder
      hosts:
        - "{{ .Values.ingress.baseDomain }}"

# APISIX Gateway Configuration
# Enable this when integrating with Enterprise Inference APISIX
apisix:
  enabled: true  # Set to true to use APISIX instead of nginx ingress
  cors:
    enabled: true
    allowOrigins: "http://localhost:3000"
    allowMethods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
    allowHeaders: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    exposeHeaders: "Content-Length,Content-Range"
    allowCredentials: true
    maxAge: 3600
  oidc:
    enabled: false
    realm: finetuning
    introspection_endpoint_auth_method: client_secret_basic
    scope: openid profile email
    # bearer_only: true rejects an unauthenticated request with 401 rather than
    # redirecting. Correct for API routes called programmatically. Set false if
    # a browser has to reach these paths directly and should be sent to the IdP.
    bearer_only: true
    # Explicit IdP endpoints. Leave empty to fall back to the legacy derivation
    # from ingress.baseDomain, which only makes sense when the IdP is served by
    # this same cluster under /realms/... Set these for an external IdP.
    discovery: ""
    introspection_endpoint: ""
    # Inject X-Userinfo (base64url JSON of the claims) upstream so the API can
    # identify the caller from a verified source instead of a client-supplied
    # X-Forwarded-User header.
    set_userinfo_header: true
    # Rewrite X-Forwarded-User from the verified X-Userinfo claims, and delete
    # any copy the client sent. The API reads X-Forwarded-User to identify the
    # caller, so this is what turns a spoofable header into a trustworthy one
    # without changing the application. Requires set_userinfo_header.
    forwardUserHeader: true
    # Set true once the IdP is served over HTTPS with a trusted certificate.
    ssl_verify: false
    # MUST match the session secret configured on the UI's route, otherwise the
    # browser session created there cannot be read here.
    session_secret: ""
    # "deny" returns 401 for unauthenticated requests instead of redirecting to
    # the IdP. Correct for API paths; the request URI is not a registered
    # redirect_uri, so a redirect would fail at the IdP anyway.
    unauth_action: "deny"
    # client_id / client_secret are written into this chart's own Secret
    # (<fullname>-secret) by secret.yaml when oidc.enabled is true. Set them via
    # --set apisix.oidc.client_id=... / apisix.oidc.client_secret=...
    client_id: ""
    client_secret: ""
    # Leave empty to point APISIX at this chart's own Secret. Only override if
    # the client credentials live in a Secret managed elsewhere — the previous
    # default, finetuning-backend-secret, is created by nothing in this chart.
    secret_ref: ""

# Secrets Configuration
# These should be set via --set flags or a separate values file
secrets:
  # Database URL (REQUIRED)
  # Format: postgresql://username:password@host:port/database
  databaseUrl: ""

  # Keycloak OAuth2 Configuration for Nvidia Backend (REQUIRED)
  # These should be provided via --set flags during deployment
  nvidiaKeycloakTokenUrl: ""      # e.g., "https://keycloak.example.com:8444/realms/nvidia/protocol/openid-connect/token"
  nvidiaKeycloakClientId: ""       # e.g., "finetune-api-client"
  nvidiaKeycloakClientSecret: ""   # Client secret from Keycloak

# Autoscaling Configuration
autoscaling:
  enabled: true  # Enable HPA for production
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilizationWindowSeconds: 300
  scaleUpStabilizationWindowSeconds: 0

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 1  # Keep at least 1 pod available during disruptions
  # maxUnavailable: 1  # Alternative: allow max 1 pod to be unavailable

# Network Policy
# Network Policy Configuration
networkPolicy:
  enabled: true
  ingress:
    fromNamespaces:
      - auth-apisix
    fromPodLabels: {}
  egress: {}

# Security Context
securityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  readOnlyRootFilesystem: false  # Set to true if app doesn't need to write to filesystem
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# Probes Configuration
probes:
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30  # 30 * 5s = 150s max startup time
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3