#
# Identities for deploying a fine-tuned model from the UI.
#
# Two of them, so neither is broader than it needs to be:
#
#   * the API's own ServiceAccount, which may only create and watch the Helm Job
#     and read what is needed to report its progress, and
#   * the deployer ServiceAccount that Job runs as, which needs write access to
#     the resources the vllm chart owns in the inference namespace.
#
# Both Roles are namespaced to the inference namespace, so this grants nothing
# anywhere else in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "finetuning-service.serviceAccountName" . }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if and .Values.modelDeployment.enabled .Values.modelDeployment.rbac.create }}
---
# What the API needs to trigger a deployment and trace it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "finetuning-service.fullname" . }}-model-deployer-client
  namespace: {{ .Values.modelDeployment.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
rules:
  # Start, replace and inspect the Helm Job, and find the chart's gateway
  # registration Job by label to report whether registration has happened.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  # Progress comes from the model pod's init containers and its readiness.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Whether the model is deployed, and how many models are deployed already.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # The ConfigMap carrying the packaged chart, checked before starting a Job so
  # a missing chart is reported as such instead of as a Helm failure.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "finetuning-service.fullname" . }}-model-deployer-client
  namespace: {{ .Values.modelDeployment.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "finetuning-service.fullname" . }}-model-deployer-client
subjects:
  - kind: ServiceAccount
    name: {{ include "finetuning-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.modelDeployment.capacity.enabled }}
---
# Reading how much room is left before deploying a model.
#
# This is the only cluster-scoped grant in the chart, and it exists because the
# question cannot be answered from one namespace: nodes are not namespaced, and
# the pods reserving capacity on them are spread across every namespace. Both
# verbs are read-only, and no other resource is included.
#
# The API treats a 403 here as "capacity unknown" rather than as an error, so
# turning this off (capacity.enabled=false) disables the pre-flight check and
# leaves deployment working exactly as it did before.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "finetuning-service.fullname" . }}-capacity-reader
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Cluster-wide, because a node's free capacity is its allocatable minus what
  # every pod on it has requested, whichever namespace those pods live in.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "finetuning-service.fullname" . }}-capacity-reader
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "finetuning-service.fullname" . }}-capacity-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "finetuning-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.modelDeployment.deployerServiceAccount }}
  namespace: {{ .Values.modelDeployment.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
---
# What Helm needs to install and uninstall the vllm chart. The verbs cover the
# resources that chart renders (Deployment, Service, PVC, ConfigMap, Secret and
# its LiteLLM register Job and deregister hook Job) plus the Secret Helm keeps
# its own release history in.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.modelDeployment.deployerServiceAccount }}
  namespace: {{ .Values.modelDeployment.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Helm watches the pods of a release while waiting, and reads hook logs.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Surfaces the reason a resource could not be created in the Job's own output.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.modelDeployment.deployerServiceAccount }}
  namespace: {{ .Values.modelDeployment.namespace }}
  labels:
    {{- include "finetuning-service.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.modelDeployment.deployerServiceAccount }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.modelDeployment.deployerServiceAccount }}
    namespace: {{ .Values.modelDeployment.namespace }}
{{- end }}
