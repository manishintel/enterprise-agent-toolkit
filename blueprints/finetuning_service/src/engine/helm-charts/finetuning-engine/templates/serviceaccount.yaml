{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "finetuning-engine.serviceAccountName" . }}
  labels:
    {{- include "finetuning-engine.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No Role is bound to this account by this chart, and that is deliberate: the
# engine's Kubernetes work happens on a *different* cluster, authenticated with
# the kubeconfig in trainCluster.kubeconfigSecret. It needs no rights in this one.
#
# For a same-cluster deployment (kubeconfigSecret.name empty) this account does
# need a Role in trainCluster.namespace covering the verbs used by
# app/services/k8s_runtime.py: create/delete/get/list/watch on jobs; get/list on
# pods, pods/log and events; create on pods/exec; create/delete on configmaps and
# secrets; get on resourcequotas and limitranges; and get/list on nodes
# (cluster-scoped, for GPU capability). Grant it out of band so the same chart
# does not have to ask for cluster-scoped RBAC it usually has no use for.
{{- end }}
