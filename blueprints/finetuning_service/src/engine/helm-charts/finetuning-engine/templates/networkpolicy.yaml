{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finetuning-engine.fullname" . }}
  labels:
    {{- include "finetuning-engine.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "finetuning-engine.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress

  ingress:
  # The Fine-Tuning API is the only legitimate caller.
  - from:
    {{- range .Values.networkPolicy.ingress.fromNamespaces }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- if .Values.networkPolicy.ingress.fromPodLabels }}
    - podSelector:
        matchLabels:
          {{- toYaml .Values.networkPolicy.ingress.fromPodLabels | nindent 10 }}
    {{- end }}
    ports:
    - protocol: TCP
      port: 8000

  egress:
  # DNS resolution
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # This release's PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432

  # Keycloak, for the JWKS fetch that verifies caller tokens.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.keycloakNamespace }}
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443

  {{- if and .Values.logStore.enabled .Values.logStore.archive.enabled .Values.networkPolicy.egress.filesApiNamespace }}
  # The Files API, for archiving a finished training log. The engine talks to the
  # Service directly rather than through the gateway: the public route is OIDC
  # gated and its IP exemption names the GPU cluster, not this pod.
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.filesApiNamespace }}
    ports:
    - protocol: TCP
      port: {{ .Values.networkPolicy.egress.filesApiPort }}
  {{- end }}

  # The GPU cluster's API server. It is outside this cluster, so this rule has no
  # selector and is scoped by port only — a NetworkPolicy cannot name a host, and
  # the address itself comes from the mounted kubeconfig. Everything the engine
  # does on the GPU cluster (creating Jobs, streaming pod logs, pods/exec for
  # cancellation) goes through this one connection, so without this rule the pod
  # comes up healthy and every job fails to dispatch.
  - ports:
    {{- range .Values.networkPolicy.egress.apiServerPorts }}
    - protocol: TCP
      port: {{ . }}
    {{- end }}
{{- end }}
