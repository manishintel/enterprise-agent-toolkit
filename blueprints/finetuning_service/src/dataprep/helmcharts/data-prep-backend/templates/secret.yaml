# The credential Secrets referenced by values.yaml.secretEnv (MinIO + Postgres)
# must be created out-of-band before deploying this chart. Keycloak is no longer
# used in agentic-toolkit; identity is derived from the X-Forwarded-User header.
#
# Run once per namespace:
#   kubectl create secret generic minio-credentials \
#     --from-literal=access-key=<your-minio-access-key> \
#     --from-literal=secret-key=<your-minio-secret-key> \
#     -n {{ .Release.Namespace }}
#
#   kubectl create secret generic postgres-credentials \
#     --from-literal=password=<your-postgres-password> \
#     -n {{ .Release.Namespace }}
