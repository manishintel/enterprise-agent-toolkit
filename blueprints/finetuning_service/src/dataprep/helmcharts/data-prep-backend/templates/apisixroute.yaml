{{- if .Values.apisix.enabled }}
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: {{ .Release.Name }}-apisixroute
  namespace: {{ .Release.Namespace }}
spec:
  http:
{{- if and .Values.apisix.engineAccess.enabled .Values.apisix.engineAccess.clientIPs }}
  {{/*
    Machine-to-machine download for the remote fine-tuning engine.

    The engine runs on a separate GPU host and pulls the training file back
    through this gateway (it is handed only file IDs), so it has no browser
    session and the OIDC files route below answers it with 401. Its identity
    travels in `Authorization: Bearer <base64-username>` — rule 3 of
    core/handlers/auth_handler.get_current_user_id — which is enough for the
    per-user file lookup and needs no OIDC.

    Trust comes from the source address instead: ingress-nginx overwrites
    X-Real-IP with the real peer address ($remote_addr), so a client-supplied
    value cannot survive, and a request with no matching header falls through
    to the gated route. APISIX's own remote_addr is the nginx pod IP, hence
    match on the header rather than match.remoteAddrs.

    Priority must beat the OIDC files route (100).
  */}}
  {{/* Leg 1: the engine reads the training file. */}}
  - name: {{ .Release.Name }}-files-engine-download-route
    priority: 150
    match:
      hosts:
      - {{ .Values.apisix.domain }}
      methods:
      - GET
      paths:
      - /enterprise-ai/v1/files*
      exprs:
      {{/*
        Two paths only, both read-only and both scoped to one file id: the
        content download, and that file's metadata.

        The metadata read is not a convenience. The trainer takes the real
        filename from it and keeps the extension on its local copy, which is what
        makes the ".jsonl only" check on the training data mean anything -- a
        '.csv' upload has to be rejected as a '.csv'. Without this the metadata
        call answers 401, the trainer falls back to assuming '.jsonl', and the
        check silently passes everything.

        Still gated: the collection listing (which would enumerate a user's
        files), the presigned-url endpoint (which would hand out a
        gateway-independent URL), and every write and delete.
      */}}
      - subject:
          scope: Path
        op: RegexMatch
        value: "^/enterprise-ai/v1/files/[^/]+(/content)?$"
      - subject:
          scope: Header
          name: X-Real-IP
        op: In
        set: {{ .Values.apisix.engineAccess.clientIPs | toJson }}
    backends:
    - serviceName: {{ .Release.Name }}
      servicePort: {{ .Values.service.port }}
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/enterprise-ai(/v1/files.*)
          - $1
        {{/* Nothing on this route sets a verified identity, so drop the user
             headers a caller could supply and let the bearer value decide. */}}
        headers:
          remove:
          - X-Forwarded-User
          - X-User
  {{/*
    Leg 2: the engine writes the trained model back. It returns an
    `output_file_id` of the form file-<uuid>, and POST /v1/files is the only
    thing that mints those, so the upload traverses this same gateway. Without
    this a job trains successfully and then dies at the upload with 401.
    Collection path only — no {file_id}, so this cannot overwrite or delete.
  */}}
  - name: {{ .Release.Name }}-files-engine-upload-route
    priority: 150
    match:
      hosts:
      - {{ .Values.apisix.domain }}
      methods:
      - POST
      paths:
      - /enterprise-ai/v1/files*
      exprs:
      - subject:
          scope: Path
        op: RegexMatch
        value: "^/enterprise-ai/v1/files/?$"
      - subject:
          scope: Header
          name: X-Real-IP
        op: In
        set: {{ .Values.apisix.engineAccess.clientIPs | toJson }}
    backends:
    - serviceName: {{ .Release.Name }}
      servicePort: {{ .Values.service.port }}
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/enterprise-ai(/v1/files.*)
          - $1
        headers:
          remove:
          - X-Forwarded-User
          - X-User
{{- end }}
  - name: {{ .Release.Name }}-files-route
    priority: 100
    match:
      hosts:
      - {{ .Values.apisix.domain  }}
      paths:
      - /enterprise-ai/v1/files*
    backends:
    - serviceName: {{ .Release.Name }}
      servicePort: {{ .Values.service.port }}
    plugins:
    {{- if .Values.apisix.cors.enabled }}
    - name: cors
      enable: true
      config:
        allow_origins: {{ .Values.apisix.cors.allow_origins | quote }}
        allow_methods: {{ .Values.apisix.cors.allow_methods | quote }}
        allow_headers: {{ .Values.apisix.cors.allow_headers | quote }}
        expose_headers: {{ .Values.apisix.cors.expose_headers | quote }}
        allow_credentials: {{ .Values.apisix.cors.allow_credentials }}
        max_age: {{ .Values.apisix.cors.max_age }}
    {{- end }}
    {{- if .Values.apisix.oidc.enabled }}
    - name: openid-connect
      enable: true
      config:
        {{/* `| default true` would flip an explicit false back to true, since
             Helm's default treats boolean false as empty. Read it directly. */}}
        bearer_only: {{ if hasKey .Values.apisix.oidc "bearer_only" }}{{ .Values.apisix.oidc.bearer_only }}{{ else }}true{{ end }}
        discovery: {{ .Values.apisix.oidc.discovery | quote }}
        {{/*
          Emit introspection_endpoint ONLY when explicitly set. openid-connect
          takes the token-introspection branch whenever this key is present, and
          that branch returns 401 immediately if the request carries no bearer
          token — so a stray value here makes session (browser) auth impossible.
        */}}
        {{- if .Values.apisix.oidc.introspection_endpoint }}
        introspection_endpoint: {{ .Values.apisix.oidc.introspection_endpoint | quote }}
        {{- end }}
        introspection_endpoint_auth_method: {{ .Values.apisix.oidc.introspection_endpoint_auth_method | quote }}
        realm: {{ .Values.apisix.oidc.realm | quote }}
        scope: {{ .Values.apisix.oidc.scope | quote }}
        ssl_verify: {{ if hasKey .Values.apisix.oidc "ssl_verify" }}{{ .Values.apisix.oidc.ssl_verify }}{{ else }}false{{ end }}
        {{- if .Values.apisix.oidc.set_userinfo_header }}
        set_userinfo_header: true
        {{- end }}
        {{- if .Values.apisix.oidc.unauth_action }}
        unauth_action: {{ .Values.apisix.oidc.unauth_action | quote }}
        {{- end }}
        {{- if .Values.apisix.oidc.session_secret }}
        {{/* Must match the UI route's session secret or the browser session
             established there cannot be decrypted here. */}}
        session:
          secret: {{ .Values.apisix.oidc.session_secret | quote }}
        {{- end }}
      secretRef: {{ .Values.apisix.oidc.secret_ref | quote }}
    {{- if .Values.apisix.oidc.forwardUserHeader }}
    {{/* Rewrite X-Forwarded-User from the verified claims and delete any
         client-supplied copy. serverless-POST-function (priority -2000) runs
         after openid-connect (2599); the pre-function variant is 10000 and
         would run before it, seeing no injected identity. */}}
    - name: serverless-post-function
      enable: true
      config:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local user = nil
              local raw = core.request.header(ctx, "X-Userinfo")
              if raw then
                local decoded = ngx.decode_base64(raw)
                if decoded then
                  local ok, claims = pcall(core.json.decode, decoded)
                  if ok and type(claims) == "table" then
                    user = claims.preferred_username or claims.email or claims.sub
                  end
                end
              end
              core.request.set_header(ctx, "X-Forwarded-User", user)
              core.request.set_header(ctx, "X-User", nil)
            end
    {{- end }}
    {{- end }}
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/enterprise-ai(/v1/files.*)
          - $1
  - name: {{ .Release.Name }}-dataprep-route
    priority: 100
    match:
      hosts:
      - {{ .Values.apisix.domain  }}
      paths:
      - /enterprise-ai/v1/dataprep*
    backends:
    - serviceName: {{ .Release.Name }}
      servicePort: {{ .Values.service.port }}
    plugins:
    {{- if .Values.apisix.cors.enabled }}
    - name: cors
      enable: true
      config:
        allow_origins: {{ .Values.apisix.cors.allow_origins | quote }}
        allow_methods: {{ .Values.apisix.cors.allow_methods | quote }}
        allow_headers: {{ .Values.apisix.cors.allow_headers | quote }}
        expose_headers: {{ .Values.apisix.cors.expose_headers | quote }}
        allow_credentials: {{ .Values.apisix.cors.allow_credentials }}
        max_age: {{ .Values.apisix.cors.max_age }}
    {{- end }}
    {{- if .Values.apisix.oidc.enabled }}
    - name: openid-connect
      enable: true
      config:
        {{/* `| default true` would flip an explicit false back to true, since
             Helm's default treats boolean false as empty. Read it directly. */}}
        bearer_only: {{ if hasKey .Values.apisix.oidc "bearer_only" }}{{ .Values.apisix.oidc.bearer_only }}{{ else }}true{{ end }}
        discovery: {{ .Values.apisix.oidc.discovery | quote }}
        {{/*
          Emit introspection_endpoint ONLY when explicitly set. openid-connect
          takes the token-introspection branch whenever this key is present, and
          that branch returns 401 immediately if the request carries no bearer
          token — so a stray value here makes session (browser) auth impossible.
        */}}
        {{- if .Values.apisix.oidc.introspection_endpoint }}
        introspection_endpoint: {{ .Values.apisix.oidc.introspection_endpoint | quote }}
        {{- end }}
        introspection_endpoint_auth_method: {{ .Values.apisix.oidc.introspection_endpoint_auth_method | quote }}
        realm: {{ .Values.apisix.oidc.realm | quote }}
        scope: {{ .Values.apisix.oidc.scope | quote }}
        ssl_verify: {{ if hasKey .Values.apisix.oidc "ssl_verify" }}{{ .Values.apisix.oidc.ssl_verify }}{{ else }}false{{ end }}
        {{- if .Values.apisix.oidc.set_userinfo_header }}
        set_userinfo_header: true
        {{- end }}
        {{- if .Values.apisix.oidc.unauth_action }}
        unauth_action: {{ .Values.apisix.oidc.unauth_action | quote }}
        {{- end }}
        {{- if .Values.apisix.oidc.session_secret }}
        {{/* Must match the UI route's session secret or the browser session
             established there cannot be decrypted here. */}}
        session:
          secret: {{ .Values.apisix.oidc.session_secret | quote }}
        {{- end }}
      secretRef: {{ .Values.apisix.oidc.secret_ref | quote }}
    {{- if .Values.apisix.oidc.forwardUserHeader }}
    {{/* Rewrite X-Forwarded-User from the verified claims and delete any
         client-supplied copy. serverless-POST-function (priority -2000) runs
         after openid-connect (2599); the pre-function variant is 10000 and
         would run before it, seeing no injected identity. */}}
    - name: serverless-post-function
      enable: true
      config:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local user = nil
              local raw = core.request.header(ctx, "X-Userinfo")
              if raw then
                local decoded = ngx.decode_base64(raw)
                if decoded then
                  local ok, claims = pcall(core.json.decode, decoded)
                  if ok and type(claims) == "table" then
                    user = claims.preferred_username or claims.email or claims.sub
                  end
                end
              end
              core.request.set_header(ctx, "X-Forwarded-User", user)
              core.request.set_header(ctx, "X-User", nil)
            end
    {{- end }}
    {{- end }}
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/enterprise-ai(/v1/dataprep.*)
          - $1
  - name: {{ .Release.Name }}-langfuse-route
    priority: 100
    match:
      hosts:
      - {{ .Values.apisix.domain  }}
      paths:
      - /enterprise-ai/v1/langfuse*
    backends:
    - serviceName: {{ .Release.Name }}
      servicePort: {{ .Values.service.port }}
    plugins:
    {{- if .Values.apisix.cors.enabled }}
    - name: cors
      enable: true
      config:
        allow_origins: {{ .Values.apisix.cors.allow_origins | quote }}
        allow_methods: {{ .Values.apisix.cors.allow_methods | quote }}
        allow_headers: {{ .Values.apisix.cors.allow_headers | quote }}
        expose_headers: {{ .Values.apisix.cors.expose_headers | quote }}
        allow_credentials: {{ .Values.apisix.cors.allow_credentials }}
        max_age: {{ .Values.apisix.cors.max_age }}
    {{- end }}
    {{/*
      This route was previously left ungated while /v1/files and /v1/dataprep
      were protected, so /v1/langfuse/projects served Langfuse project data to
      anyone and honoured a client-supplied X-Forwarded-User. It reads trace
      content, so it needs the same treatment as the other data routes.
    */}}
    {{- if .Values.apisix.oidc.enabled }}
    - name: openid-connect
      enable: true
      config:
        bearer_only: {{ if hasKey .Values.apisix.oidc "bearer_only" }}{{ .Values.apisix.oidc.bearer_only }}{{ else }}true{{ end }}
        discovery: {{ .Values.apisix.oidc.discovery | quote }}
        {{- if .Values.apisix.oidc.introspection_endpoint }}
        introspection_endpoint: {{ .Values.apisix.oidc.introspection_endpoint | quote }}
        {{- end }}
        introspection_endpoint_auth_method: {{ .Values.apisix.oidc.introspection_endpoint_auth_method | quote }}
        realm: {{ .Values.apisix.oidc.realm | quote }}
        scope: {{ .Values.apisix.oidc.scope | quote }}
        ssl_verify: {{ if hasKey .Values.apisix.oidc "ssl_verify" }}{{ .Values.apisix.oidc.ssl_verify }}{{ else }}false{{ end }}
        {{- if .Values.apisix.oidc.set_userinfo_header }}
        set_userinfo_header: true
        {{- end }}
        {{- if .Values.apisix.oidc.unauth_action }}
        unauth_action: {{ .Values.apisix.oidc.unauth_action | quote }}
        {{- end }}
        {{- if .Values.apisix.oidc.session_secret }}
        session:
          secret: {{ .Values.apisix.oidc.session_secret | quote }}
        {{- end }}
      secretRef: {{ .Values.apisix.oidc.secret_ref | quote }}
    {{- if .Values.apisix.oidc.forwardUserHeader }}
    - name: serverless-post-function
      enable: true
      config:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              local user = nil
              local raw = core.request.header(ctx, "X-Userinfo")
              if raw then
                local decoded = ngx.decode_base64(raw)
                if decoded then
                  local ok, claims = pcall(core.json.decode, decoded)
                  if ok and type(claims) == "table" then
                    user = claims.preferred_username or claims.email or claims.sub
                  end
                end
              end
              core.request.set_header(ctx, "X-Forwarded-User", user)
              core.request.set_header(ctx, "X-User", nil)
            end
    {{- end }}
    {{- end }}
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/enterprise-ai(/v1/langfuse.*)
          - $1
  - name: {{ .Release.Name }}-dataprep-health-route
    priority: 90
    match:
      hosts:
      - {{ .Values.apisix.domain  }}
      paths:
      - /enterprise-ai/dataprep/health
    backends:
    - serviceName: {{ .Release.Name }}
      servicePort: {{ .Values.service.port }}
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/enterprise-ai/dataprep(/health)
          - $1
  - name: {{ .Release.Name }}-dataprep-docs-route
    priority: 90
    match:
      hosts:
      - {{ .Values.apisix.domain  }}
      paths:
      - /enterprise-ai/dataprep/docs*
      - /enterprise-ai/dataprep/openapi.json
      - /enterprise-ai/dataprep/redoc*
    backends:
    - serviceName: {{ .Release.Name }}
      servicePort: {{ .Values.service.port }}
    plugins:
    - name: proxy-rewrite
      enable: true
      config:
        regex_uri:
          - ^/enterprise-ai/dataprep(.*)
          - $1
{{- end }}
