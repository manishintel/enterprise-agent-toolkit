##############################################################################
# Fine-Tune Plugin - Internal Variables
##############################################################################
# These are internal implementation variables for the Fine-Tune plugin.
# Users should not need to modify these values directly.
# The plugin deploys three components:
#   1. Fine-Tuning API (middleware)
#   2. Data Preparation Service (dataprep)
#   3. Fine-Tuning UI (frontend)
##############################################################################

# =============================================================================
# Global Configuration
# =============================================================================
# Plugin path for scripts
finetune_plugin_path: "{{ lookup('env', 'PWD') }}/../../blueprints/finetuning_service"

# Each component deploys to its own namespace
finetune_api_namespace: finetuning-api
finetune_engine_namespace: finetuning-engine
dataprep_namespace: dataprep
finetune_ui_namespace: finetuning-ui

finetune_ingress_class: nginx
finetune_tls_enabled: true
finetune_persistence_storage_class: local-path

# =============================================================================
# Fine-Tuning API Configuration
# =============================================================================
finetune_api_name: finetuning-service
finetune_api_replica_count: 1
finetune_api_image_repository: registry.kube-system.svc.cluster.local:5000/finetuning-service
finetune_api_image_tag: latest
finetune_api_image_pull_policy: Always
finetune_api_service_port: "8000"
finetune_api_base_path: /enterprise-ai

# API Resources
finetune_api_cpu_request: 500m
finetune_api_memory_request: 512Mi
finetune_api_cpu_limit: 2
finetune_api_memory_limit: 2Gi

# API PostgreSQL Configuration
finetune_api_postgres_enabled: true
finetune_api_postgres_port: "5432"
finetune_api_postgres_database: finetuning
finetune_api_postgres_username: finetuning
finetune_api_postgres_storage_size: 10Gi
finetune_api_postgres_version: "15"

# =============================================================================
# Fine-Tuning Engine Configuration
# =============================================================================
# The engine is the component that actually trains. It runs in this cluster as an
# ordinary HTTP service with no GPU, and turns each request into one Kubernetes
# Job on the GPU cluster (see finetune_engine_train_* below). The Fine-Tuning API
# is its only caller and reaches it over the in-cluster Service, so nothing about
# the engine is published through the gateway.
finetune_engine_name: finetuning-engine
# One replica, not a placeholder: live progress, cancellation flags and the GPU
# slot pool are in-process state. See the chart's values.yaml.
finetune_engine_replica_count: 1
finetune_engine_image_repository: registry.kube-system.svc.cluster.local:5000/finetuning-engine
finetune_engine_image_tag: latest
finetune_engine_image_pull_policy: Always
finetune_engine_service_port: "8000"

# Engine Resources. Sized for an HTTP service that streams pod logs.
finetune_engine_cpu_request: 500m
finetune_engine_memory_request: 512Mi
finetune_engine_cpu_limit: "2"
finetune_engine_memory_limit: 2Gi

# Engine PostgreSQL. The engine creates its own schema on startup, so unlike the
# API there is no init-db.sql step.
finetune_engine_postgres_port: "5432"
finetune_engine_postgres_database: finetune_engine
finetune_engine_postgres_username: finetuning
finetune_engine_postgres_storage_size: 10Gi
# Release name, which is also the Service name the engine connects to. It
# contains the Postgres chart's own name, so helm does not prefix it again.
finetune_engine_postgres_release: finetuning-engine-postgresql

# Admission. The effective concurrency is the smaller of this and the GPU quota
# on the training namespace, so raising it alone changes nothing.
finetune_engine_max_concurrent_jobs: 2
finetune_engine_gpu_memory_threshold_gb: 20

# ── Training log store ───────────────────────────────────────────────────────
# The GPU cluster is scratch. Its training Job carries ttlSecondsAfterFinished, so
# an hour after a run ends the pod and the only copy of its output are gone. The
# engine is already streaming that output to drive progress, so it writes every
# line to a claim in *this* cluster on the way past — that claim is the durable
# record, and it is annotated helm.sh/resource-policy: keep so a `helm uninstall`
# does not take a month of history with it.
finetune_engine_log_store_enabled: true
finetune_engine_log_store_size: 20Gi
finetune_engine_log_store_retention_days: 30
# Also archive each finished log to the Files API, so it lands in object storage
# beside the model it produced. Posted to the in-cluster Service, not the gateway:
# that route is OIDC-gated for browsers and its IP exemption names the GPU
# cluster's egress rather than the engine pod's.
finetune_engine_log_archive_enabled: true

# ── GPU cluster (where training Jobs are created) ────────────────────────────
# Defaults suit the B300 target. The kubeconfig path and namespace are
# user-facing and normally set in finetune-config.cfg instead.
finetune_engine_train_namespace: ftaas
finetune_engine_train_kubeconfig_secret: finetune-train-kubeconfig
finetune_engine_train_kubeconfig_mount: /etc/finetune/kubeconfig
# Trainer image, pinned by digest. `unsloth/unsloth:latest` moves, and a library
# bump inside it is an API break for the trainer — trl 0.24 dropped SFTTrainer
# arguments the engine used to pass. This digest is the build validated on the
# B300 (torch 2.11.0+cu128 / unsloth 2026.9.4 / trl 0.24.0).
finetune_engine_train_image: "docker.io/unsloth/unsloth@sha256:970b6d2229ff6e22f85e26a50a269f66f8f3cb6929ea48b1cf1c251129e42412"
# RWX claim shared by every training Job: dataset scratch, the merged model, and
# the HuggingFace cache. RWX and warm matters — merging to 16-bit re-downloads
# the original fp16 base weights, so a cold cache adds that download at the end
# of every job, after training has already succeeded.
finetune_engine_train_pvc: finetune-engine-work
finetune_engine_train_pvc_size: 300Gi
finetune_engine_train_pvc_storage_class: ceph-filesystem
finetune_engine_train_gpu_count: 1
finetune_engine_train_cpu_request: "8"
finetune_engine_train_cpu_limit: "16"
finetune_engine_train_memory_request: 48Gi
finetune_engine_train_memory_limit: 96Gi

# =============================================================================
# Data Preparation Service Configuration
# =============================================================================
dataprep_name: data-prep-backend
dataprep_replica_count: 1
dataprep_image_repository: registry.kube-system.svc.cluster.local:5000/data-prep-backend
dataprep_image_tag: latest
dataprep_image_pull_policy: Always
dataprep_service_port: "8000"
dataprep_base_path: /enterprise-ai

# Data Prep Resources
dataprep_cpu_request: 500m
dataprep_memory_request: 1Gi
dataprep_cpu_limit: 2
dataprep_memory_limit: 4Gi

# Data Prep PostgreSQL Configuration
dataprep_postgres_enabled: true
dataprep_postgres_port: "5432"
dataprep_postgres_database: dataprep
dataprep_postgres_username: dataprep
dataprep_postgres_storage_size: 10Gi
dataprep_postgres_version: "15"

# Data Prep Redis Configuration
dataprep_redis_enabled: true
dataprep_redis_port: "6379"
dataprep_redis_storage_size: 2Gi

# Data Prep MinIO Configuration
dataprep_minio_bucket: dataprep

# Namespace the vllm chart deploys inference models into. The fine-tuned model
# deploy command printed by the UI installs there, so the MinIO read credentials
# its init container needs are provisioned in this namespace too.
finetune_inference_namespace: default
finetune_inference_minio_secret: minio-internal-creds

# The fine-tuning UI can deploy a fine-tuned model with one click, which runs the
# same helm install the job detail page prints as a Job in the inference
# namespace. The chart is published there as a ConfigMap, so the API image does
# not have to carry a copy of it and this repo stays the source of the chart —
# re-run this playbook after changing the vllm chart.
finetune_deploy_chart_configmap: vllm-chart
finetune_deploy_chart_archive_key: vllm-chart.tgz
finetune_deploy_values_key: values.yaml
finetune_vllm_chart_path: "{{ playbook_dir }}/../../../core/helm-charts/vllm"
finetune_vllm_values_file: xeon-values.yaml

# Embedding model for the semantic router. LiteLLM's auto-router cannot be
# created without one (auto_router_embedding_model is required), and it encodes
# every routed request, so it stays resident. bge-base is small -- the cost is
# the reservation below, not the model.
finetune_embedding_enabled: true
finetune_embedding_release: vllm-bge-embedding
finetune_embedding_values_file: embedding-values.yaml
finetune_embedding_model: "BAAI/bge-base-en-v1.5"
finetune_embedding_cpu: "4"
finetune_embedding_memory: "8Gi"
# On the CPU backend --gpu-memory-utilization is the fraction of the container
# limit vLLM reserves, despite the name. The 0.92 default fails on an 8-16Gi
# limit; bge-base needs a fraction of what is left at 0.5.
finetune_embedding_memory_utilization: "0.5"
finetune_embedding_timeout: 15m
# 0 disables the count cap, which is the default: a count cannot tell a 1B model
# from a 70B, so it refuses cheap deployments that would fit while permitting
# expensive ones that will not. Admission is decided per request by the CPU and
# memory check against real node capacity instead. Set a positive number only if
# an installation needs a hard ceiling on how many vLLM instances exist at once
# regardless of their size.
finetune_deploy_max_models: 0

# Celery Worker Configuration
dataprep_celery_enabled: true
dataprep_celery_replica_count: 1
dataprep_celery_image_repository: registry.kube-system.svc.cluster.local:5000/celery-worker
dataprep_celery_image_tag: latest
dataprep_celery_cpu_request: 500m
dataprep_celery_memory_request: 2Gi
dataprep_celery_cpu_limit: 2
dataprep_celery_memory_limit: 8Gi

# =============================================================================
# Fine-Tuning UI Configuration
# =============================================================================
finetune_ui_name: finetuning-ui
finetune_ui_replica_count: 1
finetune_ui_image_repository: registry.kube-system.svc.cluster.local:5000/finetuning-ui
finetune_ui_image_tag: latest
finetune_ui_image_pull_policy: Always
finetune_ui_service_port: "3000"
finetune_ui_base_path: /enterprise-ai/ui

# UI Resources
finetune_ui_cpu_request: 250m
finetune_ui_memory_request: 512Mi
finetune_ui_cpu_limit: 1
finetune_ui_memory_limit: 2Gi

# =============================================================================
# Shared MinIO Configuration
# =============================================================================
finetune_minio_enabled: "true"
finetune_minio_service_name: minio
finetune_minio_port: "9000"
finetune_minio_console_port: 9001
finetune_minio_storage_size: 50Gi
finetune_minio_access_key: admin
finetune_minio_secret_key: minio123
finetune_minio_region: us-west-2
finetune_minio_secure: "false"

# =============================================================================
# Build Configuration (for Kaniko builds)
# =============================================================================
finetune_build_enabled: false
finetune_kaniko_image: gcr.io/kaniko-project/executor:latest
finetune_registry_insecure: true

# Source code paths (within plugin directory - auto-copied during deployment)
finetune_api_source_path: "{{ playbook_dir }}/../src/api"
finetune_engine_source_path: "{{ playbook_dir }}/../src/engine"
dataprep_source_path: "{{ playbook_dir }}/../src/dataprep"
finetune_ui_source_path: "{{ playbook_dir }}/../src/ui"

# =============================================================================
# Autoscaling (disabled by default)
# =============================================================================
finetune_autoscaling_enabled: false
finetune_autoscaling_min_replicas: 1
finetune_autoscaling_max_replicas: 5
finetune_autoscaling_target_cpu: 80
finetune_autoscaling_target_memory: 80

###########################################################################
# In-cluster Keycloak (identity provider for the Fine-Tuning UI)
###########################################################################
keycloak_namespace: keycloak
keycloak_release: keycloak
keycloak_db_release: keycloak-postgresql
keycloak_db_name: keycloak
keycloak_db_username: keycloak
keycloak_db_storage_size: 10Gi
keycloak_source_path: "{{ playbook_dir }}/../src/keycloak"
