# Default values for vllm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

# Enabling HPA will:
# - Ignore above replica count, as it will be controlled by HPA
# - Add example HPA scaling rules with custom metrics thresholds
# - Require custom metrics ConfigMap available in the main application chart
autoscaling:
  maxReplicas: 4
  enabled: false

# empty for CPU (longer latencies are tolerated before HPA scaling unaccelerated service)
accelDevice: ""

port: 2080
shmSize: 1Gi
image:
  repository: vllm/vllm-openai-cpu
  # Uncomment the following line to set desired image pull policy if needed, as one of Always, IfNotPresent, Never.
  # pullPolicy: ""
  # Overrides the image tag whose default is the chart appVersion.
  tag: "v0.24.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# CPU Balloon configuration for NRI resource policy
#cpu_balloon_annotation: ""

podSecurityContext:
  # fsGroup: 1001
  # runAsUser: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
    add:
      - SYS_NICE
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP

pvc:
  enabled: true

apisix:
  enabled: false

ingress:
  enabled: false # Set to true to enable the Ingress resource
  host: ""
  namespace: default
  secretname: ""

route:
  enabled: false
  host: ""
  tls:
    termination: "edge"
    insecureEdgeTerminationPolicy: "Redirect"

# Platform type: openshift or vanilla kubernetes
platform: vanilla

oidc:
  realm: master
  client_id: ""
  client_secret: ""
  discovery: ""
  introspection_endpoint: ""
  use_jwks: true


extraCmdArgs: []

# livenessProbe:
#   httpGet:
#     path: /health
#     port: http
#   initialDelaySeconds: 4600  # Start liveness checks after 1 hour (safe buffer)
#   periodSeconds: 60
#   failureThreshold: 60  # Allows up to 30 minutes of failures before restart

# readinessProbe:
#   httpGet:
#     path: /health
#     port: http
#   initialDelaySeconds: 4600  # Only mark ready after 1 hour
#   periodSeconds: 60

# startupProbe:
#   httpGet:
#     path: /health
#     port: http
#   initialDelaySeconds: 3600
#   periodSeconds: 10
#   failureThreshold: 7200  # Allows up to 2 hours (10s * 7200 = 72000s)

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 120
  periodSeconds: 30
  failureThreshold: 98
# startupProbe:
#   httpGet:
#     path: /health
#     port: http
#   initialDelaySeconds: 120
#   periodSeconds: 30
#   failureThreshold: 79

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: ei-inference-eligible
          operator: In
          values: ["true"]

LLM_MODEL_ID: Intel/neural-chat-7b-v3-3
SERVED_MODEL_NAME: ""
# Environment variables for vLLM (set in configmap):
VLLM_CPU_KVCACHE_SPACE: "40"
VLLM_RPC_TIMEOUT: "100000"
VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
VLLM_CPU_NUM_OF_RESERVED_CPU: "0"
VLLM_CONFIGURE_LOGGING: 1
VLLM_NO_USAGE_STATS: 1
VLLM_CPU_SGL_KERNEL: "1"
DO_NOT_TRACK: 1

# CPU optimization settings (can be updated by automation)
cpu_optimization_enabled: false
max_num_batched_tokens: "2048"
max_num_seqs: "256"

# Parallelism configuration (root level for global access)
tensor_parallel_size: "1"
pipeline_parallel_size: "1"

# Speculative decoding configuration
speculative:
  enabled: false

svcmonitor:
  enabled: false

global:
  http_proxy: ""
  https_proxy: ""
  no_proxy: ""
  HUGGINGFACEHUB_API_TOKEN: ""
  # service account name to be shared with all parent/child charts.
  # If set, it will overwrite serviceAccount.name.
  # If set, and serviceAccount.create is false, it will assume this service account is already created by others.
  sharedSAName: ""

  # Choose where to save your downloaded models
  # Set modelUseHostPath for local directory, this is good for one node test. Example:
  # modelUseHostPath: /mnt/opea-models
  # Set modelUsePVC for PersistentVolumeClaim(PVC), which is suitable for multinode deployment. Example:
  # modelUsePVC: model-volume
  # You can only set one of the following var, the behavior is not defined is both are set.
  # By default, both var are set to empty, the model will be downloaded and saved to a tmp volume.
  modelUseHostPath: ""
  modelUsePVC: ""

  # Install Prometheus serviceMonitor for service
  monitoring: false

  # Prometheus Helm install release name for serviceMonitor
  prometheusRelease: observability
# Fine-tuning integration: when enabled, init containers fetch the fine-tuned
# model archive from MinIO and unpack it onto the model volume before vLLM
# starts. vLLM is then pointed at the unpacked directory automatically, so
# LLM_MODEL_ID does not need to be set for fine-tuned deployments.
finetune:
  enabled: false
  # Result file id of the fine-tuning job, as shown in the fine-tuning UI.
  fileId: ""
  # Bucket the fine-tuning service writes results to.
  bucket: "dataprep"
  # Object key inside the bucket. Leave empty to look the object up by fileId:
  # results are stored under "<user_id>/<file_id>", so the key cannot be derived
  # from the file id alone. Set this to skip the lookup.
  objectKey: ""
  # The model is published to "<extractPath>/<fileId>". Must live on the model
  # volume (/data) so the archive can be unpacked and renamed into place.
  extractPath: "/data/finetuned"
  images:
    # Downloads the archive from MinIO. Ships mc; no network egress needed.
    minioMc:
      repository: "minio/mc"
      tag: "RELEASE.2025-08-13T08-35-41Z"
      pullPolicy: "IfNotPresent"
    # Validates and unpacks the archive. Needs tar/find, which minio/mc lacks.
    extract:
      repository: "busybox"
      tag: "latest"
      pullPolicy: "IfNotPresent"
  # Secret supplying MINIO_HOST, MINIO_PORT, MINIO_ACCESS_KEY and
  # MINIO_SECRET_KEY to the fetch init container. Provisioned in the inference
  # namespace by the fine-tuning plugin playbook (deploy-dataprep.yml).
  minioCredentialsSecret: "minio-internal-creds"
  # Create that secret as part of this release instead of relying on the
  # playbook. Only for standalone installs — the credentials then have to be
  # passed on the command line.
  createCredentialsSecret: false
  minio:
    host: ""
    port: "9000"
    accessKey: ""
    secretKey: ""

# Register the deployed model with the GenAI Gateway (LiteLLM) as part of the
# release, via post-install/post-upgrade hooks, so it appears in the gateway
# model list without a separate step. Models deployed by the inference playbook
# leave this off and register through
# core/playbooks/register-model-genai-gateway.yml instead.
litellmRegister:
  enabled: false
  url: "http://genai-gateway-service.genai-gateway.svc.cluster.local:4000"
  # Secret holding the gateway master key. Provisioned in the inference
  # namespace by core/playbooks/deploy-genai-gateway.yml.
  masterKeySecret:
    name: "genai-gateway-master-key"
    key: "LITELLM_MASTER_KEY"
  provider: "openai"
  mode: "chat"
  # Fine-tuned models are served from local hardware, so they are not metered
  # by default. Set these if you want the gateway to attribute spend.
  inputCostPerToken: 0
  outputCostPerToken: 0
  # Remove the model from the gateway again on `helm uninstall`.
  deregisterOnDelete: true
  image:
    repository: "curlimages/curl"
    tag: "latest"
    pullPolicy: "IfNotPresent"

# Chat template ConfigMap — mount a custom Jinja2 chat template into the container.
# Enable per-model in the playbook via --set chatTemplateConfigMap.enabled=true
chatTemplateConfigMap:
  enabled: false

# hostIPC: equivalent of docker --ipc=host, required for mp distributed executor
# with tensor-parallel on CPU (POSIX shared memory between worker processes)
hostIPC: false

# Clear stale HuggingFace download lock files before vLLM starts.
# Needed for models that use MP/multi-process download (e.g. Qwen3-Coder-30B MoE)
# to prevent lock conflicts after container restarts.
clearHFLocks:
  enabled: false
