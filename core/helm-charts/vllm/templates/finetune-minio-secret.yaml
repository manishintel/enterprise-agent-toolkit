#
# MinIO credentials for the fine-tuned model fetch init container.
#
# Normally this secret is provisioned in the inference namespace by the
# fine-tuning plugin playbook (blueprints/finetuning_service/playbooks/
# deploy-dataprep.yml), so the deploy command the UI prints stays free of
# credentials. Set finetune.createCredentialsSecret=true only for standalone
# installs where the playbook has not run.
{{- if and .Values.finetune.enabled .Values.finetune.createCredentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.finetune.minioCredentialsSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
type: Opaque
stringData:
  MINIO_HOST: {{ required "finetune.minio.host is required when finetune.createCredentialsSecret=true" .Values.finetune.minio.host | quote }}
  MINIO_PORT: {{ .Values.finetune.minio.port | quote }}
  MINIO_ACCESS_KEY: {{ required "finetune.minio.accessKey is required when finetune.createCredentialsSecret=true" .Values.finetune.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ required "finetune.minio.secretKey is required when finetune.createCredentialsSecret=true" .Values.finetune.minio.secretKey | quote }}
{{- end }}
