{{- $modelName := (default .Values.LLM_MODEL_ID .Values.SERVED_MODEL_NAME) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  {{- if ne (int .Values.replicaCount) 1 }}
  # remove if replica count should not be reset on pod update (e.g. with HPA)
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.accelDevice }}
        {{- if and .Values.cpu_balloon_annotation (not .Values.finetune.enabled) }}
        balloon.balloons.resource-policy.nri.io: {{ .Values.cpu_balloon_annotation | quote }}
        {{- end }}
        {{- end }}
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
        {{- if and (not .Values.accelDevice) (not .Values.finetune.enabled) }}
        name: vllm
        {{- end }}
    spec:
      {{- if .Values.hostIPC }}
      hostIPC: true
      {{- end }}
      # {{- with .Values.imagePullSecrets }}
      # imagePullSecrets:
      #   {{- toYaml . | nindent 8 }}
      # {{- end }}
      # serviceAccountName: {{ include "vllm.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if or .Values.finetune.enabled .Values.clearHFLocks.enabled }}
      initContainers:
      {{- if .Values.clearHFLocks.enabled }}
      - name: clear-hf-locks
        image: busybox:latest
        command: ["sh", "-c", "rm -rf /data/hub/.locks && echo 'HuggingFace download locks cleared'"]
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: true
        volumeMounts:
          - name: model-volume
            mountPath: /data
      {{- end }}
      {{- if .Values.finetune.enabled }}
      {{- if not .Values.finetune.fileId }}
      {{- fail "finetune.enabled=true requires finetune.fileId (the result file id shown on the fine-tuning job page)" }}
      {{- end }}
      {{- $ftDest := include "vllm.finetunedModelPath" . }}
      {{- $ftStage := include "vllm.finetuneStagePath" . }}
      - name: fetch-finetuned-model
        image: "{{ .Values.finetune.images.minioMc.repository }}:{{ .Values.finetune.images.minioMc.tag }}"
        imagePullPolicy: {{ .Values.finetune.images.minioMc.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            FILE_ID={{ .Values.finetune.fileId | quote }}
            BUCKET={{ .Values.finetune.bucket | quote }}
            DEST={{ $ftDest | quote }}
            ARCHIVE={{ printf "%s/%s.tar.gz" $ftStage .Values.finetune.fileId | quote }}

            if [ -f "${DEST}/config.json" ]; then
              echo "[finetune-fetch] ${DEST} already populated, skipping download"
              exit 0
            fi

            mc --no-color alias set minio "http://${MINIO_HOST}:${MINIO_PORT}" "${MINIO_ACCESS_KEY}" "${MINIO_SECRET_KEY}"

            # Resolve the object key. The fine-tuning service stores results under
            # "<user_id>/<file_id>", so it is not derivable from the file id alone.
            KEY={{ .Values.finetune.objectKey | quote }}
            if [ -z "${KEY}" ]; then
              echo "[finetune-fetch] searching bucket '${BUCKET}' for '${FILE_ID}'"
              mc --no-color find "minio/${BUCKET}" --name "${FILE_ID}*" > /tmp/matches.txt 2>/dev/null || true
              MATCH=$(head -n 1 /tmp/matches.txt)
              PREFIX="minio/${BUCKET}/"
              KEY=${MATCH#"$PREFIX"}
            fi
            if [ -z "${KEY}" ]; then
              echo "[finetune-fetch] ERROR: no object matching '${FILE_ID}' in bucket '${BUCKET}'."
              echo "[finetune-fetch] Pass --set finetune.objectKey=<key> to point at it explicitly."
              mc --no-color ls --recursive "minio/${BUCKET}" || true
              exit 1
            fi

            echo "[finetune-fetch] downloading minio/${BUCKET}/${KEY}"
            mkdir -p {{ $ftStage | quote }}
            mc --no-color cp "minio/${BUCKET}/${KEY}" "${ARCHIVE}"
            ls -l "${ARCHIVE}"
        env:
          - name: MC_CONFIG_DIR
            value: "/tmp/.mc"
          - name: HOME
            value: "/tmp"
        envFrom:
          - secretRef:
              name: {{ .Values.finetune.minioCredentialsSecret }}
        volumeMounts:
          - name: model-volume
            mountPath: /data
          - name: tmp
            mountPath: /tmp
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: true
      - name: extract-finetuned-model
        image: "{{ .Values.finetune.images.extract.repository }}:{{ .Values.finetune.images.extract.tag }}"
        imagePullPolicy: {{ .Values.finetune.images.extract.pullPolicy }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            FILE_ID={{ .Values.finetune.fileId | quote }}
            DEST={{ $ftDest | quote }}
            ARCHIVE={{ printf "%s/%s.tar.gz" $ftStage .Values.finetune.fileId | quote }}
            WORK={{ printf "%s/unpack-%s" $ftStage .Values.finetune.fileId | quote }}

            if [ -f "${DEST}/config.json" ]; then
              echo "[finetune-extract] ${DEST} already populated, skipping extraction"
              rm -f "${ARCHIVE}"
              exit 0
            fi

            echo "[finetune-extract] validating ${ARCHIVE}"
            tar -tzf "${ARCHIVE}" > /tmp/tar-contents.txt

            # Reject path traversal, absolute paths and executable payloads.
            BAD='(^|/)\.\./|^/|\.(sh|py|exe|so|dylib)$'
            if grep -qE "${BAD}" /tmp/tar-contents.txt; then
              echo "[finetune-extract] ERROR: archive contains prohibited entries:"
              grep -nE "${BAD}" /tmp/tar-contents.txt
              exit 1
            fi

            rm -rf "${WORK}"
            mkdir -p "${WORK}"
            echo "[finetune-extract] unpacking into ${WORK}"
            tar -xzf "${ARCHIVE}" -C "${WORK}"

            # True when the directory holds model weights in a format vLLM loads.
            # Each pattern is tested on its own: an unmatched glob stays literal,
            # so passing them all to one `ls` would fail whenever any is absent.
            has_weights() {
              for w in "$1"/*.safetensors "$1"/*.bin "$1"/*.gguf; do
                if [ -f "${w}" ]; then
                  return 0
                fi
              done
              return 1
            }

            # The archive is rooted at the training job directory and may also
            # carry per-epoch checkpoints, so take the shallowest directory that
            # holds both a config and weights.
            MODEL_DIR=""
            for depth in 2 3 4 5 6; do
              for cfg in $(find "${WORK}" -maxdepth "${depth}" -name config.json -type f); do
                d=$(dirname "${cfg}")
                if has_weights "${d}"; then
                  MODEL_DIR="${d}"
                  break
                fi
              done
              if [ -n "${MODEL_DIR}" ]; then
                break
              fi
            done

            if [ -z "${MODEL_DIR}" ]; then
              echo "[finetune-extract] ERROR: archive has no directory containing config.json plus weights."
              if ! find "${WORK}" -name config.json -type f | grep -q .; then
                if find "${WORK}" -name adapter_config.json -type f | grep -q .; then
                  echo "[finetune-extract] It looks like a LoRA adapter only; vLLM needs the merged model."
                fi
              fi
              find "${WORK}" -maxdepth 3
              exit 1
            fi

            echo "[finetune-extract] publishing ${MODEL_DIR} to ${DEST}"
            rm -rf "${DEST}"
            mkdir -p "$(dirname "${DEST}")"
            mv "${MODEL_DIR}" "${DEST}"
            # vLLM runs unprivileged; make the model world-readable.
            chmod -R a+rX "${DEST}"

            rm -rf "${WORK}" "${ARCHIVE}"
            echo "[finetune-extract] ready:"
            ls -lh "${DEST}"
        volumeMounts:
          - name: model-volume
            mountPath: /data
          - name: tmp
            mountPath: /tmp
        securityContext:
          runAsUser: 0
          readOnlyRootFilesystem: true
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          envFrom:
            - configMapRef:
                name: {{ include "vllm.fullname" . }}-config
            {{- if .Values.global.extraEnvConfig }}
            - configMapRef:
                name: {{ .Values.global.extraEnvConfig }}
                optional: true
            {{- end }}
            - secretRef:
                name: {{ include "vllm.fullname" . }}-secret
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          # command:
          #   - /bin/bash
          #   - -c
          #   - |
          #     python3 -m vllm.entrypoints.openai.api_server --dtype {{ .Values.d_type }}  --model {{ .Values.LLM_MODEL_ID }} --port {{ .Values.port }} --tensor-parallel-size {{ .Values.tensor_parallel_size }} --block-size {{ .Values.block_size }} --max-model-len {{ .Values.max_model_len }} --disable-log-requests
          args:
            {{- $modelConfig := (index .Values.modelConfigs $modelName | default dict) }}
            {{- $modelArgs := $modelConfig.extraCmdArgs | default .Values.defaultModelConfigs.extraCmdArgs }}
            {{- range $modelArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.accelDevice }}
            - "--tensor-parallel-size"
            - {{ .Values.tensor_parallel_size | default (index .Values.modelConfigs $modelName | default dict).tensor_parallel_size | default .Values.defaultModelConfigs.tensor_parallel_size | quote}}
            {{- else }}
            # CPU deployment - add parallelism settings
            - "--tensor-parallel-size"
            - {{ .Values.tensor_parallel_size | default (index .Values.modelConfigs $modelName | default dict).tensor_parallel_size | default .Values.defaultModelConfigs.tensor_parallel_size | quote}}
            - "--pipeline-parallel-size"
            - {{ .Values.pipeline_parallel_size | default (index .Values.modelConfigs $modelName | default dict).pipeline_parallel_size | default .Values.defaultModelConfigs.pipeline_parallel_size | quote}}
            {{- end }}
            {{- if and .Values.speculative .Values.speculative.enabled }}
            {{- if $modelConfig.speculativeConfig }}
            - "--speculative_config"
            - {{ $modelConfig.speculativeConfig | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.finetune.enabled }}
            - "--trust-remote-code"
            - "--tokenizer-mode"
            - "slow"
            {{- end }}
            - "--model"
            - {{ include "vllm.modelPath" . | quote }}
            - --served-model-name
            - {{ include "vllm.servedModelName" . | quote }}
            - "--port"
            - {{ .Values.port | quote }}
          volumeMounts:
            - mountPath: /data
              name: model-volume
            - mountPath: /dev/shm
              name: shm
            - mountPath: /tmp
              name: tmp
            - mountPath: /root/.cache/vllm
              name: vllm-cache
            {{- if .Values.chatTemplateConfigMap.enabled }}
            - mountPath: /workspace/vllm/examples
              name: chat-templates
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          {{- if or .Values.accelDevice .Values.cpu .Values.memory }}
          resources:
            {{- if not .Values.accelDevice }}
            {{- if or .Values.cpu .Values.memory }}
            requests:
              {{- if .Values.cpu }}
              cpu: {{ .Values.cpu | quote }}
              {{- end }}
              {{- if .Values.memory }}
              memory: {{ .Values.memory | quote }}
              {{- end }}
            limits:
              {{- if .Values.cpu }}
              cpu: {{ .Values.cpu | quote }}
              {{- end }}
              {{- if .Values.memory }}
              memory: {{ .Values.memory | quote }}
              {{- end }}
            {{- end }}
            {{- else }}
            limits:
            {{- end }}
          {{- end }}
            
      volumes:
        - name: model-volume
          {{- if .Values.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "vllm.fullname" . }}-pvc
          {{- else if .Values.global.modelUseHostPath }}
          hostPath:
            path: {{ .Values.global.modelUseHostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shmSize }}
        - name: tmp
          emptyDir: {}
        - name: vllm-cache
          emptyDir: {}
        {{- if .Values.chatTemplateConfigMap.enabled }}
        - name: chat-templates
          configMap:
            name: {{ include "vllm.fullname" . }}-chat-templates
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.evenly_distributed }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "vllm.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- if not .Values.accelDevice }}
      # extra time to finish processing buffered requests on CPU before pod is forcibly terminated
      terminationGracePeriodSeconds: 120
      {{- end }}
